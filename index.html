<!DOCTYPE html>
<html>
<head>
    <title>Shiva Netra Lite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .form-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .data-box {
            background: #f9f9f9;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
            border: 2px dashed #667eea;
        }
        .data-item {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shiva Netra Lite</h1>
        <p style="text-align:center;color:#666;">AI Visual Assistant - Early Access</p>
        
        <form id="earlyAccessForm">
            <div class="form-group">
                <label>Your Name *</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label>Birth Year (Optional)</label>
                <select id="birthYear">
                    <option value="">Select Year</option>
                </select>
            </div>
            
            <button type="submit">Join Early Access</button>
        </form>
        
        <div id="dataDisplay" class="data-box">
            <h3 style="color:#333;">📊 Data Collection</h3>
            <div id="dataOutput">No data yet. Submit the form above.</div>
            <button onclick="clearAllData()" style="background:#ef4444;margin-top:15px;">Clear All Data</button>
        </div>
        
        <p style="text-align:center;margin-top:30px;color:#777;font-size:14px;">
            Shiva Netra Lite &copy; 2024 | Privacy-First AI Vision
        </p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
