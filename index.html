
             <!DOCTYPE html>
<html>
<head>
    <title>Shiva Netra Lite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        /* VERY SIMPLE STYLES */
        body {
            font-family: Arial;
            background: #f0f0f0;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        .input-group {
            margin: 15px 0;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        .data-box {
            background: #f9f9f9;
            padding: 20px;
            margin-top: 20px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        
        .data-item {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 3px solid #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Shiva Netra Lite</h1>
        <p style="text-align:center;color:#666;">AI Visual Assistant - Early Access</p>
        
        <!-- SIMPLE FORM -->
        <form id="myForm">
            <div class="input-group">
                <label>Your Name *</label>
                <input type="text" id="userName" required placeholder="Enter your name">
            </div>
            
            <div class="input-group">
                <label>Email Address *</label>
                <input type="email" id="userEmail" required placeholder="your@email.com">
            </div>
            
            <!-- SIMPLE DATE DROPDOWN -->
            <div class="input-group">
                <label>Birth Year (Optional)</label>
                <select id="birthYear">
                    <option value="">Select Year</option>
                    <!-- Years will be added by JavaScript -->
                </select>
            </div>
            
            <button type="submit">Join Early Access</button>
        </form>
        
        <!-- DATA DISPLAY AREA -->
        <div id="dataArea" class="data-box">
            <h3>📊 Your Data</h3>
            <div id="dataOutput">No data yet. Submit the form above.</div>
            <button onclick="clearData()" style="background:#f44336;margin-top:10px;">Clear All Data</button>
        </div>
    </div>

    <!-- ALL JAVASCRIPT IS HERE - NO SEPARATE FILE NEEDED -->
    <script>
        // When page loads
        window.onload = function() {
            console.log("Shiva Netra Lite loaded!");
            
            // Fill years in dropdown (1900-2024)
            fillYears();
            
            // Load existing data
            loadData();
            
            // Setup form
            setupForm();
        };
        
        // Fill years in dropdown
        function fillYears() {
            const select = document.getElementById("birthYear");
            const currentYear = new Date().getFullYear();
            
            for(let year = currentYear; year >= 1900; year--) {
                const option = document.createElement("option");
                option.value = year;
                option.textContent = year;
                select.appendChild(option);
            }
        }
        
        // Setup form submission
        function setupForm() {
            const form = document.getElementById("myForm");
            
            form.onsubmit = function(e) {
                e.preventDefault(); // Stop page reload
                
                // Get values
                const name = document.getElementById("userName").value.trim();
                const email = document.getElementById("userEmail").value.trim();
                const birthYear = document.getElementById("birthYear").value;
                
                // Validate
                if(!name || !email) {
                    alert("Please enter name and email");
                    return false;
                }
                
                if(!email.includes("@") || !email.includes(".")) {
                    alert("Please enter valid email");
                    return false;
                }
                
                // Create data object
                const userData = {
                    name: name,
                    email: email,
                    year: birthYear || "Not provided",
                    time: new Date().toLocaleString(),
                    date: new Date().toISOString().split("T")[0]
                };
                
                // Save data
                saveData(userData);
                
                // Show success
                alert("✅ Thank you " + name + "!\n\nYou are now on the early access list.");
                
                // Reset form
                form.reset();
                
                // Reload data display
                loadData();
                
                return false;
            };
        }
        
        // Save data to localStorage
        function saveData(data) {
            // Get existing data
            let allData = JSON.parse(localStorage.getItem("shivaData") || "[]");
            
            // Add new data
            allData.push(data);
            
            // Save back
            localStorage.setItem("shivaData", JSON.stringify(allData));
            
            console.log("Data saved:", data);
        }
        
        // Load and display data
        function loadData() {
            const output = document.getElementById("dataOutput");
            
            // Get data
            const data = JSON.parse(localStorage.getItem("shivaData") || "[]");
            
            if(data.length === 0) {
                output.innerHTML = "<p>No data yet. Submit the form above.</p>";
                return;
            }
            
            // Create HTML
            let html = "<p><strong>Total entries: " + data.length + "</strong></p>";
            
            data.forEach((item, index) => {
                html += `
                    <div class="data-item">
                        <strong>${index + 1}. ${item.name}</strong><br>
                        <small>Email: ${item.email}</small><br>
                        <small>Year: ${item.year}</small><br>
                        <small style="color:#777;">${item.time}</small>
                    </div>
                `;
            });
            
            output.innerHTML = html;
        }
        
        // Clear all data
        function clearData() {
            if(confirm("Are you sure you want to delete ALL data?")) {
                localStorage.removeItem("shivaData");
                loadData();
                alert("All data cleared!");
            }
        }
        
        // Debug function - type this in browser console: addTestData()
        window.addTestData = function() {
            const testData = {
                name: "Test User",
                email: "test@example.com",
                year: "1990",
                time: new Date().toLocaleString(),
                date: new Date().toISOString().split("T")[0]
            };
            
            saveData(testData);
            loadData();
            alert("Test data added!");
        };
        
        console.log("Script loaded successfully!");
    </script>
</body>
</html>
